<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" role="img" aria-labelledby="podustrialLogoTitle">
  <title id="podustrialLogoTitle">Podustrial</title>

  <!-- Factory silhouette with the Kubernetes wheel embedded as its rose window -->
  <path d="M80,210 L240,120 L400,210 L400,310 L80,310 Z M295,175 A55,55 0 1 0 185,175 A55,55 0 1 0 295,175 Z" fill="#3F6478" fill-rule="evenodd"/>

  <!-- chimney -->
  <rect x="330" y="142" width="16" height="38" fill="#3F6478"/>
  <path d="M 338,140 C 330,130 344,122 338,112" fill="none" stroke="#9AA5AA" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- window frame -->
  <circle cx="240" cy="175" r="54" fill="none" stroke="#B5451C" stroke-width="3"/>

  <!-- Kubernetes-style wheel -->
  <line x1="240.0" y1="160.0" x2="240.0" y2="132.0" stroke="#B5451C" stroke-width="7" stroke-linecap="round"/>
<line x1="251.7" y1="165.6" x2="273.6" y2="148.2" stroke="#B5451C" stroke-width="7" stroke-linecap="round"/>
<line x1="254.6" y1="178.3" x2="281.9" y2="184.6" stroke="#B5451C" stroke-width="7" stroke-linecap="round"/>
<line x1="246.5" y1="188.5" x2="258.7" y2="213.7" stroke="#B5451C" stroke-width="7" stroke-linecap="round"/>
<line x1="233.5" y1="188.5" x2="221.3" y2="213.7" stroke="#B5451C" stroke-width="7" stroke-linecap="round"/>
<line x1="225.4" y1="178.3" x2="198.1" y2="184.6" stroke="#B5451C" stroke-width="7" stroke-linecap="round"/>
<line x1="228.3" y1="165.6" x2="206.4" y2="148.2" stroke="#B5451C" stroke-width="7" stroke-linecap="round"/>
  <circle cx="240" cy="175" r="46" fill="none" stroke="#B5451C" stroke-width="8"/>
  <circle cx="240" cy="175" r="13" fill="#B5451C"/>

  <!-- Wordmark -->
  <text x="240" y="358" text-anchor="middle" font-family="'Arial Black','Segoe UI',Arial,sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#2F4A5E">PODUSTRIAL</text>
</svg>
